[package]
name = "pcloudcc-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
